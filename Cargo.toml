[package]
name = "web_max_area_data_collection"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# [profile.dev.package."*"]
# opt-level = 3

# [profile.release]
# lto = true

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "28.0"
pollster = "0.3"
bytemuck = "1.23.0"
serde = "1.0.219"
serde_json = "1.0.145"
csv = "1.4.0"
nalgebra-glm = { version = "0.20.0", features = ["convert-bytemuck", "serde-serialize"] }
num_cpus = "1.17.0"
rfd = "0.15.4"
postcard = { version = "1.1.3", features = ["alloc"] }
chrono = "0.4.44"
futures = "0.3.32"

[profile.dev.package.postcard]
opt-level = 3

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9.2"
rand_distr = "0.5.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "28.0", features = ["webgl", "web"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
]}
